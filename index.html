<script>
/* 카카오톡·네이버·페이스북·인스타그램 등 인앱 브라우저에서 열리면 기본 브라우저로 다시 열기 */
(function () {
  var ua = navigator.userAgent || '';
  var url = location.href;
  var inApp = /KAKAOTALK|NAVER\(inapp|FBAN|FBAV|FB_IAB|Instagram|Line\/|DaumApps|everytimeApp|wv\)/i.test(ua);
  if (/KAKAOTALK/i.test(ua)) { location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(url); return; }
  if (/Line\//i.test(ua) && url.indexOf('openExternalBrowser=1') < 0) {
    location.href = url + (url.indexOf('?') < 0 ? '?' : '&') + 'openExternalBrowser=1'; return;
  }
  if (!inApp) return;
  if (/Android/i.test(ua)) {
    location.href = 'intent://' + url.replace(/^https?:\/\//, '') + '#Intent;scheme=https;package=com.android.chrome;end'; return;
  }
  // iOS 인앱 브라우저는 사파리로 강제 이동이 불가 → 안내 화면(Safari로 열기 설명 + 주소 복사 + 그냥 여기서 보기)
  document.addEventListener('DOMContentLoaded', function () {
    var box = document.createElement('div');
    box.setAttribute('role', 'dialog');
    box.style.cssText = 'position:fixed;inset:0;z-index:99;background:rgba(13,17,32,.94);color:#eef0f8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;font:15px/1.6 system-ui,sans-serif';
    box.innerHTML = '<strong style="font-size:18px">사파리에서 열어 주세요</strong>' +
      '<span>이 앱 안의 브라우저에서는 일부 기능이 제대로 작동하지 않을 수 있어요.<br>⋯ 메뉴에서 <b>Safari로 열기</b>를 눌러 주세요.</span>' +
      '<button id="copyUrl" style="font:inherit;padding:10px 18px;border-radius:999px;border:0;background:#eef0f8;color:#0d1120">주소 복사</button>' +
      '<button id="stayHere" style="font:inherit;background:none;border:0;color:#9aa3c0;text-decoration:underline">그냥 여기서 보기</button>';
    document.body.appendChild(box);
    document.getElementById('copyUrl').onclick = function () {
      var b = this;
      (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(
        function () { b.textContent = '복사했어요'; }, function () { prompt('주소를 복사하세요', url); });
    };
    document.getElementById('stayHere').onclick = function () { box.remove(); };
  });
})();
</script>

<style>

:root{
  --ink:#0b0a0d;
  --pearl:#ece8e1;
  --mist:#a39fa8;
  --hair:rgba(236,232,225,.18);
  --veil:rgba(11,10,13,.55);
  --glint:#f6f1e6;
  --accent:#e8eef2;
  --serif:"Gowun Batang","Noto Serif KR","Apple SD Gothic Neo",serif;
  --italic:"Cormorant Garamond","Times New Roman",serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ink);color:var(--pearl);overscroll-behavior:none}
body{font-family:var(--serif);-webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.top{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 16px);padding-inline:20px;display:flex;justify-content:space-between;align-items:baseline;gap:12px;pointer-events:none}
.top .mon{font-size:13px;letter-spacing:.28em;color:var(--pearl);opacity:.9;transition:font-size .3s ease}
.top .mon.big{font-size:16px;letter-spacing:.18em;opacity:1}
.top .cut{font-size:13px;letter-spacing:.12em;color:var(--mist)}
.zoom{position:fixed;right:14px;top:calc(env(safe-area-inset-top,0px) + 54px);display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px;border:1px solid var(--hair);border-radius:999px;background:var(--veil);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.zoom button{width:40px;height:40px;border:0;border-radius:50%;background:none;font-size:22px;line-height:1;cursor:pointer}
.zoom #fs{font-size:17px;border-top:1px solid var(--hair);border-radius:0 0 999px 999px}
.ios-tip{margin:0;font-size:12px;line-height:1.6;color:var(--mist);opacity:.85}
.zoom output{font-family:var(--italic);font-style:italic;font-size:14px;color:var(--mist);font-variant-numeric:tabular-nums;padding:2px 0}
.looks{position:fixed;left:14px;top:calc(env(safe-area-inset-top,0px) + 54px);display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.looks button{display:flex;align-items:baseline;gap:7px;height:36px;padding:0 14px;border:1px solid var(--hair);border-radius:999px;background:var(--veil);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);cursor:pointer;font-size:13px}
.looks span{font-size:11px;letter-spacing:.12em;color:var(--mist)}
.looks b{font-weight:400;color:var(--pearl);letter-spacing:.04em}
.sheet:not(.gone) ~ .looks{opacity:0;pointer-events:none}
.nav{position:fixed;top:44%;width:44px;height:64px;border:0;background:none;font-size:30px;color:var(--pearl);opacity:.55;cursor:pointer}
.nav:hover{opacity:.95}
#prev{left:4px}#next{right:4px}
.dock{position:fixed;left:0;right:0;bottom:0;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;flex-direction:column;align-items:center;gap:12px;background:linear-gradient(to top,rgba(11,10,13,.9) 55%,rgba(11,10,13,0))}
.info{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;transition:opacity .5s ease;height:132px;justify-content:flex-end}
.alt{display:flex;gap:6px;margin-top:6px;min-height:30px}
.alt button{font-size:12.5px;letter-spacing:.04em;height:30px;padding:0 14px;border-radius:999px;border:1px solid var(--hair);background:none;color:var(--mist);cursor:pointer}
.alt button[aria-pressed="true"]{background:var(--glint);color:var(--ink);border-color:var(--glint)}
.info.hide{opacity:0;pointer-events:none}
.dock{pointer-events:none}.dock .months,.dock .alt{pointer-events:auto}
.name{display:flex;align-items:baseline;gap:10px}
.name h2{margin:0;font-weight:700;font-size:clamp(24px,7vw,30px);letter-spacing:.06em}
.name span{font-family:var(--italic);font-style:italic;font-size:19px;color:var(--accent)}
.meaning{margin:0;font-size:14px;letter-spacing:.2em;color:var(--pearl);opacity:.85}
.spec{margin:0;font-size:11.5px;letter-spacing:.05em;color:var(--mist);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.months{display:flex;gap:3px;justify-content:center;max-width:100%}
.months button{width:26px;height:40px;border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer}

.months button[aria-current="true"] i{transform:scale(1.45);box-shadow:0 0 0 1.5px var(--pearl),0 0 10px var(--c)}

.sheet{position:fixed;left:0;right:0;bottom:0;padding:24px 20px calc(env(safe-area-inset-bottom,0px) + 34px);display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;background:linear-gradient(to top,rgba(11,10,13,.96) 55%,rgba(11,10,13,0));transition:opacity .8s ease;z-index:5}
.sheet h1{margin:0;font-weight:400;font-size:clamp(20px,5.6vw,26px);letter-spacing:.06em;text-wrap:balance}
.sheet p{margin:0;font-size:14px;line-height:1.7;color:var(--mist);max-width:28em}
.sheet .go{font-size:15px;letter-spacing:.14em;min-height:48px;padding:0 30px;border-radius:999px;border:1px solid var(--hair);background:var(--glint);color:var(--ink);cursor:pointer}
.sheet.gone{opacity:0;pointer-events:none}
.sheet:not(.gone) ~ .dock,.sheet:not(.gone) ~ .nav{opacity:0;pointer-events:none}
.dock,.nav,.top,.looks,.zoom{transition:opacity .8s ease}
body.intro .top,body.intro .dock,body.intro .nav,body.intro .looks,body.intro .zoom{opacity:0!important;pointer-events:none!important}

.hint{position:fixed;left:50%;top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 200px);z-index:6;max-width:calc(100% - 32px);text-overflow:ellipsis;overflow:hidden;transform:translateX(-50%);font-size:13px;letter-spacing:.06em;color:var(--pearl);background:var(--veil);border:1px solid var(--hair);padding:8px 16px;border-radius:999px;white-space:nowrap;transition:opacity 1.2s ease;pointer-events:none}
.hint.off{opacity:0}
.err{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;line-height:1.7;color:var(--mist);z-index:9}

@media (prefers-reduced-motion:reduce){.info,.sheet,.dock,.nav,.months i{transition:none}}

function brilliant(N,off){
  var RT=0.56,CA=34.5*DEG,PA=40.8*DEG,GT=0.035;
  var zg=GT/2,zb=-GT/2,tc=Math.tan(CA),tp=Math.tan(PA),zt=zg+(1-RT)*tc,cz=zb-tp,ch=Math.cos(Math.PI/N);
  var pS=RT+0.5*(1-RT),pQ=0.23,v=[];
  function P(r,a,z){v.push([r*Math.cos(a),r*Math.sin(a),z]);}
  for(var k=0;k<N;k++){

    P(RT,th,zt);P(1,th,zg);P(1,ph,zg);P(1,th,zb);P(1,ph,zb);

    if(aa<=1e-4){v.push([0,bb,z],[0,-bb,z]);return;}
    [[1,1],[-1,1],[-1,-1],[1,-1]].forEach(function(s){v.push([s[0]*aa,s[1]*(bb-cc),z],[s[0]*(aa-cc),s[1]*bb,z]);});}
